services:
  - type: web
    name: current-nai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Postgres connection string (e.g. from Supabase: Project Settings →
      # Database → Connection string). sync: false means Render prompts for
      # the value in its dashboard instead of storing it in this file.
      - key: DATABASE_URL
        sync: false
      # Pepper for hashing reporter IPs (see backend/main.py). Required in
      # production — the server refuses to start without it, since a
      # fallback baked into public source code would defeat the point.
      - key: IP_HASH_SECRET
        sync: false
      # Pepper for the anonymous per-visitor identity cookie (see
      # backend/main.py). Also required in production for the same reason
      # as IP_HASH_SECRET above.
      - key: ANON_ID_SECRET
        sync: false
      # LocationIQ API key for address geocoding (see backend/main.py) — free
      # tier, no card required: https://locationiq.com. Without this set,
      # geocoding falls back to Nominatim's public API directly, which is
      # rate-limited on Render's shared outbound IP in practice.
      - key: LOCATIONIQ_API_KEY
        sync: false
    autoDeploy: true
