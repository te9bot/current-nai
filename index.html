<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bolt.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="কারেন্ট Koi? — community-reported electricity and load-shedding status tracker for Bangladesh" />
    <title>কারেন্ট Koi? — Live Bangladesh Power Outage Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded non-blocking (media=print swapped to all on load) so the
         fonts round-trip never delays first paint. display=optional (not
         swap): a metric-matched fallback (index.css) already occupies the
         same box a loaded font would, so there's no layout-shift reason to
         swap late at all — optional shows the real font immediately when
         it's already cached/fast enough, and otherwise keeps the fallback
         for the rest of this page view rather than swapping mid-visit. That
         swap was measured (local Lighthouse trace) as the dominant source of
         this app's layout-shift score: one global "Web font loaded" reflow
         touching the headline, nav, and body text all at once. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=JetBrains+Mono:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=JetBrains+Mono:wght@400;500;600&family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=optional"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
